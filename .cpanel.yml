---
# cPanel > Git Version Control > Manage > "Deploy HEAD Commit" runs these steps. It COPIES the program over the live folder (plain cp, no rsync needed)
# and never deletes anything. .env, storage, vendor, uploads, the web server files (public/index.php, .htaccess) and the data folders are not touched.
# Each line is self contained (no shared variables) so it works whether cPanel runs the lines in one shell or in separate shells.
deployment:
  tasks:
    - echo "deploy started" > /home/ranscoco/deploy-log.txt
    - for d in app bootstrap config database docs lang packages resources routes; do mkdir -p /home/ranscoco/wims.ransco.co.tz/$d && cp -a $d/. /home/ranscoco/wims.ransco.co.tz/$d/ || exit 1; done >> /home/ranscoco/deploy-log.txt 2>&1
    - for f in artisan composer.json composer.lock package.json package-lock.json phpunit.xml postcss.config.js server.php tailwind.config.js vite.config.js; do cp -a $f /home/ranscoco/wims.ransco.co.tz/$f || exit 1; done >> /home/ranscoco/deploy-log.txt 2>&1
    - for f in public/*; do if [ "$f" != "public/index.php" ]; then cp -a "$f" /home/ranscoco/wims.ransco.co.tz/public/ || exit 1; fi; done >> /home/ranscoco/deploy-log.txt 2>&1
    - /opt/cpanel/ea-php82/root/usr/bin/php /home/ranscoco/wims.ransco.co.tz/artisan migrate --force >> /home/ranscoco/deploy-log.txt 2>&1
    - /opt/cpanel/ea-php82/root/usr/bin/php /home/ranscoco/wims.ransco.co.tz/artisan optimize:clear >> /home/ranscoco/deploy-log.txt 2>&1
    # rebuild the route table and the compiled pages once per deploy, so no visitor pays for it (the settings cache is optional, see below)
    - /opt/cpanel/ea-php82/root/usr/bin/php /home/ranscoco/wims.ransco.co.tz/artisan route:cache >> /home/ranscoco/deploy-log.txt 2>&1 || true
    # OPTIONAL speed-up, off by default: when the empty file /home/ranscoco/config-cache.on exists, the settings are also cached at deploy (faster start of every request).
    # Then a change made by hand in .env only takes effect after the next deploy (or `php artisan config:clear`). Delete the file to switch it off again.
    - if [ -f /home/ranscoco/config-cache.on ]; then /opt/cpanel/ea-php82/root/usr/bin/php /home/ranscoco/wims.ransco.co.tz/artisan config:cache >> /home/ranscoco/deploy-log.txt 2>&1 || true; fi
    - /opt/cpanel/ea-php82/root/usr/bin/php /home/ranscoco/wims.ransco.co.tz/artisan view:cache >> /home/ranscoco/deploy-log.txt 2>&1 || true
    - /opt/cpanel/ea-php82/root/usr/bin/php /home/ranscoco/wims.ransco.co.tz/artisan simulation:sync >> /home/ranscoco/deploy-log.txt 2>&1 || true
